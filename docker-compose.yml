version: "3.3"

services:
  web:
    build:
      context: .
      dockerfile: ./docker/web.Dockerfile
    ports:
      - ${SERVER_PORT}:${SERVER_PORT}
      - ${DEBUG_PORT}:2345
    volumes:
      - .:/clean_web
    env_file: .env
    container_name: boilerplate-web
    depends_on:
      - database

  cloud-sql-proxy:
    build:
      context: .
      dockerfile: ./docker/cloud.Dockerfile
    ports:
      - "33068:3306"
    env_file:
      - .env
    volumes:
      - ./serviceAccountKey.json:/secrets/cloudsql/serviceAccountKey.json:ro
    container_name: cloud-sql-proxy

  database:
    build:
      context: .
      dockerfile: ./docker/db.Dockerfile
    environment:
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    container_name: boilerplate-db
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--default-authentication-plugin=mysql_native_password",
      ]
    ports:
      - 33066:3306
    volumes:
      - boilerplate_db:/var/lib/mysql

  adminer:
    image: adminer
    ports:
      - ${ADMINER_PORT}:8080

  # Optional: only needed when IDEMPOTENCY_STORE=redis. Comment out if unused.
  redis:
    image: redis:7-alpine
    container_name: boilerplate-redis
    ports:
      - "6379:6379"
    volumes:
      - boilerplate_redis:/data

  # --- Microservice infrastructure ---

  # Async event bus. Set NATS_URL=nats://nats:4222 in .env to enable.
  nats:
    image: nats:2.10-alpine
    container_name: boilerplate-nats
    command: ["-js"] # enable JetStream
    ports:
      - "4222:4222" # client
      - "8222:8222" # monitoring

  # Trace collector. Set OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317 in .env.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: boilerplate-otel
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./docker/observability/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC

  # Metrics scraper (scrapes web:/metrics). Visit http://localhost:9091.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: boilerplate-prometheus
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"

volumes:
  boilerplate_db:
  boilerplate_redis:
